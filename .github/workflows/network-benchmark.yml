name: Network Latency Benchmark

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Samples per target (1-5)"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

concurrency:
  group: public-invite-network-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run conservative network measurements
        env:
          INVITE_CODES: ${{ secrets.INVITE_CODES }}
          SAMPLES: ${{ inputs.samples }}
        run: python3 scripts/network_benchmark.py

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-latency-results
          path: network-latency.csv
          if-no-files-found: ignore
          retention-days: 14
