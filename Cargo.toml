[package]
name = "invite-monitor"
version = "0.1.0"
edition = "2021"
description = "A conservative, low-overhead public invite-page monitor"
license = "MIT"

[dependencies]
hdrhistogram = "7"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "stream"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
