# Copy this file to config.toml.
# The first entries in urls.txt are priority targets.
# A central dispatcher prioritizes due targets while keeping a fair turn
# for regular targets. All requests share global spacing and 429 cooldown.

interval_ms = 15000
priority_targets = 3
priority_interval_ms = 5000
global_min_spacing_ms = 1000
concurrency = 2
timeout_secs = 8
max_body_bytes = 262144
